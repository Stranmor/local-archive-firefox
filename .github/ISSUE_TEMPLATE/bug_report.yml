name: Bug report
description: Report a reproducible Local Archive failure using synthetic or redacted evidence.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never attach real chat exports, session data, credentials, or private conversation screenshots.
  - type: input
    id: version
    attributes:
      label: Local Archive version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: firefox
    attributes:
      label: Firefox version and operating system
      placeholder: Firefox 153 on Linux
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Telegram Web surface
      options:
        - web.telegram.org/k/
        - web.telegram.org/a/
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a synthetic test chat whenever possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all private chat content, credentials, identifiers, and session data.
          required: true
